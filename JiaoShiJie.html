<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>教师节祝福 - 北营中学6班</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0d0015;
            font-family: "华文楷体", "STKaiti", "KaiTi", "楷体", "Microsoft YaHei", serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 右上角标题 - 使用渐变与阴影提升质感 */
        .title-overlay {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            text-align: right;
            pointer-events: none;
            user-select: none;
            max-width: 70vw;
        }
        .title-overlay .main-title {
            font-size: clamp(18px, 4.2vw, 48px);
            font-weight: 700;
            color: #fff4e0;
            text-shadow:
                0 0 12px rgba(255, 60, 60, 0.7),
                0 0 30px rgba(200, 30, 30, 0.5),
                0 4px 20px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.06em;
            line-height: 1.3;
            background: linear-gradient(135deg, #ffdbb5 0%, #ffb07c 50%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 12px rgba(180, 20, 20, 0.5));
        }
        .title-overlay .sub-title {
            font-size: clamp(14px, 2.6vw, 32px);
            font-weight: 600;
            color: #ffdd99;
            text-shadow:
                0 0 20px rgba(255, 150, 50, 0.6),
                0 0 40px rgba(255, 80, 0, 0.3),
                0 4px 16px rgba(0, 0, 0, 0.5);
            margin-top: 4px;
            letter-spacing: 0.3em;
            background: linear-gradient(135deg, #ffecb3, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.3));
        }
        .title-overlay .sub-title::before {
            content: "❤️ ";
            -webkit-text-fill-color: initial;
            color: #ff6b6b;
            filter: drop-shadow(0 0 8px rgba(255, 50, 50, 0.6));
        }
        .title-overlay .sub-title::after {
            content: " ❤️";
            -webkit-text-fill-color: initial;
            color: #ff6b6b;
            filter: drop-shadow(0 0 8px rgba(255, 50, 50, 0.6));
        }

        /* 底部小提示 - 交互指示 */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255, 200, 180, 0.4);
            font-size: clamp(11px, 1.4vw, 16px);
            letter-spacing: 0.15em;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 12px rgba(255, 100, 100, 0.15);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 180, 0.08);
            white-space: nowrap;
        }
        @media (max-width: 480px) {
            .title-overlay {
                top: 12px;
                right: 14px;
                max-width: 80vw;
            }
            .hint {
                bottom: 12px;
                padding: 4px 14px;
                font-size: 10px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <!-- 右上角标题 -->
    <div class="title-overlay" id="titleOverlay">
        <div class="main-title">🌹 祝北营中学6班老师<br />9月10日教师节快乐</div>
        <div class="sub-title">您辛苦了</div>
    </div>

    <!-- 底部交互提示 -->
    <div class="hint">✨ 拖拽旋转 · 滚轮缩放 · 自动漫游 ✨</div>

    <!-- Three.js 使用 import map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- 导入 Three.js 核心库与扩展 -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ----- 基本场景设置 -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0015);

        // 相机
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 8);
        camera.lookAt(0, 0.5, 0);

        // 渲染器
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.prepend(renderer.domElement);

        // ----- 后期特效：Bloom 泛光，让花朵和粒子更梦幻 -----
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.6, // 强度
            0.2, // 半径
            0.1 // 阈值
        );
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ----- 控制器 (带自动旋转) -----
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.target.set(0, 0.8, 0);
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 2.5;
        controls.maxDistance = 18;
        controls.update();

        // ----- 灯光系统 -----
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x442233, 0.5);
        scene.add(ambientLight);

        // 主光源 - 暖色
        const mainLight = new THREE.DirectionalLight(0xffccaa, 1.8);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        // 补光 - 红色氛围
        const redLight = new THREE.DirectionalLight(0xff3366, 0.8);
        redLight.position.set(-4, 2, -5);
        scene.add(redLight);

        // 背光 - 金色
        const goldLight = new THREE.DirectionalLight(0xffaa44, 0.6);
        goldLight.position.set(-3, 1, 6);
        scene.add(goldLight);

        // 底部柔光
        const fillLight = new THREE.PointLight(0x992244, 0.5, 12);
        fillLight.position.set(0, -1, 0);
        scene.add(fillLight);

        // 点缀点光源
        const accentLight = new THREE.PointLight(0xff6644, 0.4, 8);
        accentLight.position.set(2, 1, 3);
        scene.add(accentLight);

        // ----- 辅助地面 (视觉锚点 + 反射光晕) -----
        const groundGeometry = new THREE.CircleGeometry(8, 48);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a0025,
            roughness: 0.9,
            metalness: 0.0,
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide,
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.4;
        ground.receiveShadow = true;
        scene.add(ground);

        // 地面光晕环
        const ringGeometry = new THREE.RingGeometry(0.8, 2.5, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x882244,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -0.35;
        scene.add(ring);

        const ring2 = new THREE.RingGeometry(3, 4.5, 64);
        const ringMaterial2 = new THREE.MeshBasicMaterial({
            color: 0xcc3366,
            transparent: true,
            opacity: 0.08,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const ring2Mesh = new THREE.Mesh(ring2, ringMaterial2);
        ring2Mesh.rotation.x = -Math.PI / 2;
        ring2Mesh.position.y = -0.33;
        scene.add(ring2Mesh);

        // ----- 创建花瓣形状 (使用贝塞尔曲线) -----
        function createPetalShape() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.08, 0.08, 0.22, 0.22, 0.28, 0.42);
            shape.bezierCurveTo(0.34, 0.62, 0.26, 0.82, 0.16, 0.92);
            shape.bezierCurveTo(0.08, 0.98, 0.04, 1.0, 0, 1.0);
            shape.bezierCurveTo(-0.04, 1.0, -0.08, 0.98, -0.16, 0.92);
            shape.bezierCurveTo(-0.26, 0.82, -0.34, 0.62, -0.28, 0.42);
            shape.bezierCurveTo(-0.22, 0.22, -0.08, 0.08, 0, 0);
            return shape;
        }

        // ----- 创建一朵花 (返回 Group) -----
        function createFlower({
            color = 0xff2255,
            innerColor = 0xff5577,
            petalCount = 8,
            size = 1.0,
            posX = 0,
            posY = 0,
            posZ = 0,
            rotationY = 0,
            scaleVariation = 0.0,
        } = {}) {
            const group = new THREE.Group();

            // 花瓣材质 - 外层
            const petalMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.35,
                metalness: 0.05,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.92,
                emissive: color,
                emissiveIntensity: 0.08,
                envMapIntensity: 0.4,
            });

            // 内层花瓣材质 (稍亮)
            const innerMat = new THREE.MeshStandardMaterial({
                color: innerColor,
                roughness: 0.30,
                metalness: 0.05,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.90,
                emissive: innerColor,
                emissiveIntensity: 0.10,
                envMapIntensity: 0.4,
            });

            const shape = createPetalShape();
            const geo = new THREE.ShapeGeometry(shape);

            // 外层花瓣
            const outerCount = petalCount;
            for (let i = 0; i < outerCount; i++) {
                const angle = (i / outerCount) * Math.PI * 2;
                const mesh = new THREE.Mesh(geo, petalMat);
                const s = size * (0.75 + Math.random() * 0.25);
                mesh.scale.set(s, s, s);
                mesh.position.set(
                    Math.cos(angle) * 0.12 * size,
                    Math.sin(angle) * 0.12 * size,
                    0
                );
                mesh.rotation.set(
                    Math.sin(angle) * 0.15,
                    0,
                    angle
                );
                // 让花瓣稍微向外弯曲
                mesh.rotation.x += 0.12;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
            }

            // 内层花瓣 (错开角度)
            const innerCount = Math.max(5, petalCount - 2);
            for (let i = 0; i < innerCount; i++) {
                const angle = (i / innerCount) * Math.PI * 2 + 0.3;
                const mesh = new THREE.Mesh(geo, innerMat);
                const s = size * (0.50 + Math.random() * 0.20);
                mesh.scale.set(s, s, s);
                mesh.position.set(
                    Math.cos(angle) * 0.06 * size,
                    Math.sin(angle) * 0.06 * size,
                    0.02 * size
                );
                mesh.rotation.set(
                    Math.sin(angle) * 0.08,
                    0,
                    angle + 0.2
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
            }

            // 花蕊 (多层)
            const stamenMat = new THREE.MeshStandardMaterial({
                color: 0xffdd44,
                roughness: 0.3,
                metalness: 0.1,
                emissive: 0xffaa00,
                emissiveIntensity: 0.25,
            });
            const stamen = new THREE.Mesh(
                new THREE.SphereGeometry(size * 0.14, 12, 12),
                stamenMat
            );
            stamen.position.set(0, 0, 0.04 * size);
            stamen.scale.set(1, 1, 0.7);
            stamen.castShadow = true;
            group.add(stamen);

            // 花蕊小颗粒
            const smallMat = new THREE.MeshStandardMaterial({
                color: 0xffaa33,
                roughness: 0.4,
                emissive: 0xff8800,
                emissiveIntensity: 0.15,
            });
            for (let i = 0; i < 12; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * 0.5;
                const r = size * 0.18;
                const dot = new THREE.Mesh(
                    new THREE.SphereGeometry(size * 0.025 + Math.random() * 0.015, 6, 6),
                    smallMat
                );
                dot.position.set(
                    Math.cos(theta) * Math.sin(phi) * r,
                    Math.sin(theta) * Math.sin(phi) * r,
                    Math.cos(phi) * r * 0.6 + 0.04 * size
                );
                group.add(dot);
            }

            // 位置 & 旋转
            group.position.set(posX, posY, posZ);
            group.rotation.y = rotationY;
            // 随机倾斜
            group.rotation.x = (Math.random() - 0.5) * 0.2;
            group.rotation.z = (Math.random() - 0.5) * 0.2;

            // 存储花瓣mesh引用用于动画
            group.userData = {
                petals: group.children.filter(c => c.isMesh && c.geometry.type === 'ShapeGeometry'),
                floatSpeed: 0.3 + Math.random() * 0.4,
                floatPhase: Math.random() * Math.PI * 2,
                rotSpeed: 0.2 + Math.random() * 0.3,
                baseY: posY,
            };

            return group;
        }

        // ----- 生成花丛 -----
        const flowers = [];
        const flowerColors = [
            0xff2255, 0xff3366, 0xff4477, 0xff1155,
            0xee2255, 0xdd3366, 0xff4488, 0xff0055,
            0xcc2255, 0xff3366, 0xff5588, 0xff2266,
        ];
        const flowerGroup = new THREE.Group();

        // 主花丛 - 分布在圆形区域内
        const count = 18;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.8 + Math.random() * 2.8;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = -0.2 + Math.random() * 0.6;

            const colorIdx = Math.floor(Math.random() * flowerColors.length);
            const color = flowerColors[colorIdx];
            const innerColor = flowerColors[(colorIdx + 3) % flowerColors.length];

            const size = 0.35 + Math.random() * 0.45;
            const flower = createFlower({
                color: color,
                innerColor: innerColor,
                petalCount: 7 + Math.floor(Math.random() * 4),
                size: size,
                posX: x,
                posY: y,
                posZ: z,
                rotationY: Math.random() * Math.PI * 2,
            });
            flowerGroup.add(flower);
            flowers.push(flower);
        }

        // 额外几朵较大的花，作为视觉焦点
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.4 + Math.random() * 1.2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = 0.0 + Math.random() * 0.3;
            const color = 0xff0044;
            const flower = createFlower({
                color: color,
                innerColor: 0xff4477,
                petalCount: 10,
                size: 0.6 + Math.random() * 0.3,
                posX: x,
                posY: y,
                posZ: z,
                rotationY: Math.random() * Math.PI * 2,
            });
            flowerGroup.add(flower);
            flowers.push(flower);
        }

        scene.add(flowerGroup);

        // 添加一些漂浮的小花蕾 (点缀)
        const budMat = new THREE.MeshStandardMaterial({
            color: 0xff3366,
            roughness: 0.4,
            emissive: 0xcc2244,
            emissiveIntensity: 0.1,
        });
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.5 + Math.random() * 3.5;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = 0.2 + Math.random() * 1.2;
            const bud = new THREE.Mesh(
                new THREE.SphereGeometry(0.04 + Math.random() * 0.06, 6, 6),
                budMat
            );
            bud.position.set(x, y, z);
            flowerGroup.add(bud);
        }

        // ----- 粒子系统 (红色 + 金色 + 白色) -----
        const particleCount = 700;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const velocities = []; // 用于动画

        const colorPalette = [
            new THREE.Color(0xff3366),
            new THREE.Color(0xff5577),
            new THREE.Color(0xffaa44),
            new THREE.Color(0xffdd88),
            new THREE.Color(0xff6688),
            new THREE.Color(0xff4488),
            new THREE.Color(0xffbb66),
            new THREE.Color(0xffeedd),
        ];

        for (let i = 0; i < particleCount; i++) {
            const radius = 2.0 + Math.random() * 5.0;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.8 - 0.4;

            const x = Math.cos(theta) * radius * Math.cos(phi);
            const z = Math.sin(theta) * radius * Math.cos(phi);
            const y = Math.sin(phi) * radius * 0.6 + 0.8;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i * 3] = col.r;
            colors[i * 3 + 1] = col.g;
            colors[i * 3 + 2] = col.b;

            sizes[i] = 0.02 + Math.random() * 0.07;

            velocities.push({
                x: (Math.random() - 0.5) * 0.004,
                y: (Math.random() - 0.5) * 0.004,
                z: (Math.random() - 0.5) * 0.004,
                phase: Math.random() * Math.PI * 2,
                speed: 0.2 + Math.random() * 0.4,
                baseX: x,
                baseY: y,
                baseZ: z,
                radius: radius,
                theta: theta,
                phi: phi,
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 使用圆形粒子纹理 (Canvas生成)
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.2, 'rgba(255,220,200,1)');
        gradient.addColorStop(0.7, 'rgba(255,100,80,0.8)');
        gradient.addColorStop(1, 'rgba(255,50,50,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const particleTexture = new THREE.CanvasTexture(canvas);

        const particleMat = new THREE.PointsMaterial({
            size: 0.08,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.85,
            vertexColors: true,
            sizeAttenuation: true,
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // 存储粒子数据以便动画
        const particleData = {
            positions: particleGeo.attributes.position.array,
            velocities: velocities,
            geometry: particleGeo,
        };

        // ----- 额外光晕粒子 (大颗粒, 稀疏) -----
        const glowCount = 120;
        const glowGeo = new THREE.BufferGeometry();
        const glowPos = new Float32Array(glowCount * 3);
        const glowCol = new Float32Array(glowCount * 3);
        const glowSiz = new Float32Array(glowCount);
        for (let i = 0; i < glowCount; i++) {
            const r = 1.5 + Math.random() * 4.5;
            const t = Math.random() * Math.PI * 2;
            const p = Math.random() * Math.PI * 0.6 - 0.3;
            glowPos[i * 3] = Math.cos(t) * r * Math.cos(p);
            glowPos[i * 3 + 1] = Math.sin(p) * r * 0.5 + 0.6;
            glowPos[i * 3 + 2] = Math.sin(t) * r * Math.cos(p);
            const c = new THREE.Color(0xff8866).lerp(new THREE.Color(0xffdd99), Math.random());
            glowCol[i * 3] = c.r;
            glowCol[i * 3 + 1] = c.g;
            glowCol[i * 3 + 2] = c.b;
            glowSiz[i] = 0.08 + Math.random() * 0.18;
        }
        glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
        glowGeo.setAttribute('color', new THREE.BufferAttribute(glowCol, 3));
        glowGeo.setAttribute('size', new THREE.BufferAttribute(glowSiz, 1));

        const glowMat = new THREE.PointsMaterial({
            size: 0.25,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.25,
            vertexColors: true,
            sizeAttenuation: true,
        });
        const glowSystem = new THREE.Points(glowGeo, glowMat);
        scene.add(glowSystem);

        // ----- 环境装饰：漂浮的闪烁星点 (使用小平面) -----
        const starGroup = new THREE.Group();
        const starMat = new THREE.MeshBasicMaterial({
            color: 0xffdd99,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        for (let i = 0; i < 40; i++) {
            const star = new THREE.Mesh(
                new THREE.PlaneGeometry(0.02 + Math.random() * 0.05, 0.02 + Math.random() * 0.05),
                starMat
            );
            const r = 2 + Math.random() * 5;
            const t = Math.random() * Math.PI * 2;
            const p = Math.random() * Math.PI * 0.5 - 0.25;
            star.position.set(
                Math.cos(t) * r * Math.cos(p),
                Math.sin(p) * r * 0.4 + 0.8,
                Math.sin(t) * r * Math.cos(p)
            );
            star.lookAt(0, 0.8, 0);
            star.userData = {
                phase: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 0.8,
                baseScale: 0.5 + Math.random() * 0.5,
            };
            starGroup.add(star);
        }
        scene.add(starGroup);

        // ----- 调整花朵整体位置 -----
        flowerGroup.position.y = -0.2;

        // ----- 动画循环 -----
        const clock = new THREE.Clock();

        function animate() {
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // 1. 花朵动画：浮动 + 旋转
            flowers.forEach((flower, idx) => {
                const ud = flower.userData;
                if (ud) {
                    // 上下浮动
                    const floatOffset = Math.sin(time * ud.floatSpeed + ud.floatPhase) * 0.06;
                    flower.position.y = ud.baseY + floatOffset;
                    // 自转
                    flower.rotation.y += ud.rotSpeed * 0.005;
                    // 花瓣微动 (对每个花瓣mesh)
                    if (ud.petals) {
                        ud.petals.forEach((petal, pi) => {
                            const wave = Math.sin(time * 1.2 + pi * 0.5 + idx) * 0.008;
                            petal.rotation.x += wave * 0.01;
                        });
                    }
                }
            });

            // 2. 粒子动画 (缓慢漂浮 + 波动)
            const pos = particleData.positions;
            const vel = particleData.velocities;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const v = vel[i];
                // 在基础位置附近做圆周/波动运动
                const angleOffset = time * v.speed * 0.15;
                const rad = v.radius + Math.sin(time * v.speed * 0.3 + v.phase) * 0.15;
                const theta = v.theta + time * v.speed * 0.02;
                const phi = v.phi + Math.sin(time * v.speed * 0.2 + v.phase) * 0.03;

                const x = Math.cos(theta) * rad * Math.cos(phi);
                const z = Math.sin(theta) * rad * Math.cos(phi);
                const y = Math.sin(phi) * rad * 0.5 + 0.8 + Math.sin(time * v.speed * 0.2 + v.phase) * 0.08;

                pos[i3] = x;
                pos[i3 + 1] = y;
                pos[i3 + 2] = z;
            }
            particleData.geometry.attributes.position.needsUpdate = true;

            // 3. 光晕粒子缓慢旋转
            glowSystem.rotation.y = time * 0.015;

            // 4. 星星闪烁
            starGroup.children.forEach((star) => {
                const ud = star.userData;
                const scale = ud.baseScale * (0.5 + 0.5 * Math.sin(time * ud.speed + ud.phase));
                star.scale.set(scale, scale, 1);
                star.material.opacity = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(time * ud.speed * 0.7 + ud.phase));
            });
            starGroup.rotation.y = time * 0.01;

            // 5. 地面光环脉动
            const pulse = 0.8 + 0.2 * Math.sin(time * 0.3);
            ring.material.opacity = 0.08 * pulse;
            ring2Mesh.material.opacity = 0.05 * pulse;

            // 6. 相机自动旋转 (OrbitControls)
            controls.update();

            // 7. 渲染 (使用Composer带Bloom)
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();

        // ----- 响应式适配 -----
        function onResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            composer.setSize(width, height);

            // 移动端调整相机位置
            if (width < 768) {
                camera.position.set(5, 3.5, 7);
            } else {
                camera.position.set(4, 3, 8);
            }
            controls.update();
        }

        window.addEventListener('resize', onResize);

        // 设备方向变化时也适配
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 300);
        });

        // 初始适配
        setTimeout(onResize, 100);

        // 对移动端，双击重置视角
        renderer.domElement.addEventListener('dblclick', () => {
            controls.autoRotate = !controls.autoRotate;
        });

        // 触摸设备：三指点击切换自动旋转
        let touchCount = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            touchCount = e.touches.length;
        });
        renderer.domElement.addEventListener('touchend', (e) => {
            if (touchCount === 3) {
                controls.autoRotate = !controls.autoRotate;
            }
        });

        // 键盘 R 键切换自动旋转
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                controls.autoRotate = !controls.autoRotate;
            }
        });

        // 控制台提示
        console.log('🌹 教师节快乐！按 R 键或三指点击切换自动旋转');
        console.log('❤️ 祝北营中学6班老师节日快乐，您辛苦了！');

        // 显示加载完成
        document.body.style.opacity = '1';

        // 小彩蛋：动态修改标题颜色 (随时间缓慢变化)
        const titleEl = document.querySelector('.title-overlay .main-title');
        if (titleEl) {
            let hue = 0;
            setInterval(() => {
                hue = (hue + 0.3) % 360;
                const c1 = `hsl(${hue}, 80%, 70%)`;
                const c2 = `hsl(${hue + 30}, 80%, 55%)`;
                const c3 = `hsl(${hue + 60}, 80%, 65%)`;
                titleEl.style.background = `linear-gradient(135deg, ${c1}, ${c2}, ${c3})`;
                titleEl.style.webkitBackgroundClip = 'text';
                titleEl.style.backgroundClip = 'text';
            }, 8000);
        }

        console.log('✅ Three.js 教师节祝福场景已启动！');
    </script>
</body>
</html>
